<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="deepquest.io — something is emerging.">
    <title>deepquest.io</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --accent: #64748b;
            --accent-light: #94a3b8;
            --accent-dim: rgba(100, 116, 139, 0.15);
            --accent-glow: rgba(148, 163, 184, 0.12);
            --success: #4a6b5d;
            --success-glow: rgba(74, 107, 93, 0.5);
            --bg: #0f1114;
            --text-primary: #d5d8db;
            --text-secondary: #8b9298;
            --text-muted: #636e72;
            --border: rgba(100, 116, 139, 0.15);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
        }

        /* Subtle noise */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(100, 116, 139, 0.015) 2px, rgba(100, 116, 139, 0.015) 4px);
            pointer-events: none;
            z-index: 1;
        }

        /* Vignette */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0.5) 100%);
            pointer-events: none;
            z-index: 2;
        }

        /* ===== PARTICLE NETWORK CANVAS ===== */
        #network-canvas {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
        }

        /* Page layout */
        .page {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* ===== RING SYSTEM ===== */
        .ring-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin-bottom: 2.5rem;
            opacity: 0;
            transform: scale(0.92);
            animation: fadeScale 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }

        /* Ambient glow behind ring */
        .ring-glow {
            position: absolute;
            inset: -30px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            animation: glowPulse 4s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .progress-ring {
            position: relative;
            z-index: 2;
            transform: rotate(-90deg);
            filter: drop-shadow(0 0 12px rgba(148, 163, 184, 0.25));
        }

        .ring-bg {
            fill: none;
            stroke: var(--border);
            stroke-width: 1;
        }

        .ring-progress {
            fill: none;
            stroke: url(#ringGrad);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-dasharray: 527.79;
            stroke-dashoffset: 527.79;
            animation: ringFill 10s cubic-bezier(0.4, 0, 0.2, 1) 1s infinite;
        }

        .ring-outer {
            fill: none;
            stroke: var(--accent-dim);
            stroke-width: 0.5;
            stroke-dasharray: 8 16;
            transform-origin: center;
            animation: outerSpin 30s linear infinite;
        }

        @keyframes outerSpin {
            to { transform: rotate(360deg); }
        }

        .ring-inner {
            fill: none;
            stroke: rgba(148, 163, 184, 0.06);
            stroke-width: 0.5;
        }

        .ring-dot {
            fill: var(--accent-light);
            filter: drop-shadow(0 0 6px rgba(148, 163, 184, 0.6));
            animation: ringDotMove 10s cubic-bezier(0.4, 0, 0.2, 1) 1s infinite;
        }

        @keyframes ringDotMove {
            0% { opacity: 0; }
            3% { opacity: 1; }
            55% { opacity: 1; }
            62% { opacity: 1; }
            90% { opacity: 0; }
            100% { opacity: 0; }
        }

        .ring-ticks line {
            stroke: rgba(148, 163, 184, 0.08);
            stroke-width: 1;
        }

        .ring-ticks line:nth-child(4n+1) {
            stroke: rgba(148, 163, 184, 0.15);
            stroke-width: 1.2;
        }

        @keyframes ringFill {
            0% { stroke-dashoffset: 527.79; }
            55% { stroke-dashoffset: 52.78; }
            62% { stroke-dashoffset: 52.78; }
            100% { stroke-dashoffset: 527.79; }
        }

        /* ===== ORBITING DOTS ===== */
        .orbit-container {
            position: absolute;
            inset: -20px;
            z-index: 3;
        }

        .orbit-dot {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--accent-light);
            top: 50%;
            left: 50%;
            transform-origin: 0 0;
        }

        .orbit-dot::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background: var(--accent-light);
            opacity: 0.3;
            filter: blur(3px);
        }

        .orbit-dot-1 {
            animation: orbit1 12s linear infinite;
            opacity: 0.7;
        }

        .orbit-dot-2 {
            animation: orbit2 18s linear infinite;
            opacity: 0.5;
            width: 3px;
            height: 3px;
        }

        .orbit-dot-3 {
            animation: orbit3 25s linear infinite;
            opacity: 0.4;
            width: 2.5px;
            height: 2.5px;
        }

        .orbit-dot-4 {
            animation: orbit4 15s linear infinite reverse;
            opacity: 0.35;
            width: 2px;
            height: 2px;
        }

        @keyframes orbit1 {
            0% { transform: rotate(0deg) translateX(120px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(120px) rotate(-360deg); }
        }

        @keyframes orbit2 {
            0% { transform: rotate(90deg) translateX(135px) rotate(-90deg); }
            100% { transform: rotate(450deg) translateX(135px) rotate(-450deg); }
        }

        @keyframes orbit3 {
            0% { transform: rotate(200deg) translateX(108px) rotate(-200deg); }
            100% { transform: rotate(560deg) translateX(108px) rotate(-560deg); }
        }

        @keyframes orbit4 {
            0% { transform: rotate(45deg) translateX(145px) rotate(-45deg); }
            100% { transform: rotate(405deg) translateX(145px) rotate(-405deg); }
        }

        /* ===== WORDMARK ===== */
        .wordmark {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(2.8rem, 7vw, 4.5rem);
            font-weight: 500;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 2rem;
            opacity: 0;
            transform: translateY(16px);
            animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
        }

        .wordmark .dot-io {
            font-weight: 400;
            color: var(--accent-light);
        }

        /* ===== TERMINAL ===== */
        .terminal {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(0.7rem, 1.3vw, 0.82rem);
            font-weight: 300;
            line-height: 2;
            color: var(--text-muted);
            text-align: center;
            max-width: 480px;
            width: 100%;
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: fadeIn 0.6s ease 1.2s forwards;
        }

        .terminal-line {
            opacity: 0;
        }

        .terminal-line.visible {
            opacity: 1;
        }

        .t-cursor {
            display: inline-block;
            width: 0.52em;
            height: 1.05em;
            background: var(--accent-light);
            margin-left: 1px;
            vertical-align: text-bottom;
            animation: cursorBlink 1s step-end infinite;
        }

        @keyframes cursorBlink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .ok-tag {
            color: var(--success);
            font-weight: 500;
            text-shadow: 0 0 8px var(--success-glow);
            animation: okFlash 0.5s ease-out;
        }

        @keyframes okFlash {
            0% { text-shadow: 0 0 16px var(--success-glow); }
            100% { text-shadow: 0 0 8px var(--success-glow); }
        }

        .status-line {
            color: var(--accent-light);
            font-weight: 500;
            animation: statusPulse 3s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%, 100% { opacity: 0.7; text-shadow: 0 0 8px rgba(148, 163, 184, 0.3); }
            50% { opacity: 1; text-shadow: 0 0 16px rgba(148, 163, 184, 0.5); }
        }

        /* ===== TAGLINE ===== */
        .tagline {
            font-size: clamp(0.95rem, 2vw, 1.15rem);
            font-weight: 300;
            color: var(--text-secondary);
            letter-spacing: 0.01em;
            opacity: 0;
            transform: translateY(12px);
        }

        .tagline.show {
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* ===== HUD CORNERS ===== */
        .hud {
            position: fixed;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 300;
            color: var(--text-muted);
            opacity: 0;
            z-index: 11;
            letter-spacing: 0.03em;
            animation: fadeIn 0.6s ease 0.5s forwards;
        }

        .hud-tl { top: 1.2rem; left: 1.2rem; }
        .hud-tr { top: 1.2rem; right: 1.2rem; }
        .hud-bl { bottom: 1.2rem; left: 1.2rem; }
        .hud-br { bottom: 1.2rem; right: 1.2rem; }

        .hud-dot {
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--success);
            margin-right: 6px;
            vertical-align: middle;
            animation: dotPulse 2s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 0.5; box-shadow: 0 0 4px var(--success-glow); }
            50% { opacity: 1; box-shadow: 0 0 8px var(--success-glow); }
        }

        /* ===== KEYFRAMES ===== */
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeScale {
            to { opacity: 1; transform: scale(1); }
        }

        /* ===== REDUCED MOTION ===== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .ring-progress { animation: none; stroke-dashoffset: 52.78; }
            .ring-outer { animation: none; }
            .ring-glow { animation: none; opacity: 0.7; }
            .orbit-dot { animation: none; opacity: 0; }
            #network-canvas { display: none; }
            .terminal, .wordmark, .ring-container,
            .tagline, .hud { opacity: 1; transform: none; }
            .terminal-line { opacity: 1; }
        }

        /* ===== MOBILE ===== */
        @media (max-width: 640px) {
            .page { padding: 1.5rem; }
            .ring-container { width: 170px; height: 170px; margin-bottom: 2rem; }
            .terminal { font-size: 0.65rem; margin-bottom: 2rem; }
            .hud { font-size: 0.55rem; }
            .hud-tl, .hud-tr { top: 0.6rem; }
            .hud-bl, .hud-br { bottom: 0.6rem; }
            .hud-tl, .hud-bl { left: 0.6rem; }
            .hud-tr, .hud-br { right: 0.6rem; }
            .orbit-dot-3, .orbit-dot-4 { display: none; }
        }
    </style>
</head>
<body>
    <!-- Particle network -->
    <canvas id="network-canvas"></canvas>

    <!-- HUD corners -->
    <div class="hud hud-tl"><span class="hud-dot"></span>SYS://deepquest.io</div>
    <div class="hud hud-tr" id="clock">00:00:00</div>
    <div class="hud hud-bl" id="indexed">INDEXED 0 sources</div>
    <div class="hud hud-br" id="hud-models">MODELS 0 | NODES 0</div>

    <!-- Main content -->
    <div class="page">
        <!-- Ring system -->
        <div class="ring-container">
            <div class="ring-glow"></div>

            <!-- Orbiting data dots -->
            <div class="orbit-container">
                <div class="orbit-dot orbit-dot-1"></div>
                <div class="orbit-dot orbit-dot-2"></div>
                <div class="orbit-dot orbit-dot-3"></div>
                <div class="orbit-dot orbit-dot-4"></div>
            </div>

            <svg class="progress-ring" width="220" height="220" viewBox="0 0 220 220">
                <defs>
                    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#94a3b8;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#64748b;stop-opacity:0.1" />
                    </linearGradient>
                </defs>

                <!-- Tick marks -->
                <g class="ring-ticks" transform="translate(110,110)">
                    <line x1="0" y1="-92" x2="0" y2="-88" transform="rotate(0)"/>
                    <line x1="0" y1="-92" x2="0" y2="-89" transform="rotate(15)"/>
                    <line x1="0" y1="-92" x2="0" y2="-89" transform="rotate(30)"/>
                    <line x1="0" y1="-92" x2="0" y2="-89" transform="rotate(45)"/>
                    <line x1="0" y1="-92" x2="0" y2="-88" transform="rotate(60)"/>
                    <line x1="0" y1="-92" x2="0" y2="-89" transform="rotate(75)"/>
                    <line x1="0" y1="-92" x2="0" y2="-89" transform="rotate(90)"/>
                    <line x1="0" y1="-92" x2="0" y2="-89" transform="rotate(105)"/>
                    <line x1="0" y1="-92" x2="0" y2="-88" transform="rotate(120)"/>
                    <line x1="0" y1="-92" x2="0" y2="-89" transform="rotate(135)"/>
                    <line x1="0" y1="-92" x2="0" y2="-89" transform="rotate(150)"/>
                    <line x1="0" y1="-92" x2="0" y2="-89" transform="rotate(165)"/>
                    <line x1="0" y1="-92" x2="0" y2="-88" transform="rotate(180)"/>
                    <line x1="0" y1="-92" x2="0" y2="-89" transform="rotate(195)"/>
                    <line x1="0" y1="-92" x2="0" y2="-89" transform="rotate(210)"/>
                    <line x1="0" y1="-92" x2="0" y2="-89" transform="rotate(225)"/>
                    <line x1="0" y1="-92" x2="0" y2="-88" transform="rotate(240)"/>
                    <line x1="0" y1="-92" x2="0" y2="-89" transform="rotate(255)"/>
                    <line x1="0" y1="-92" x2="0" y2="-89" transform="rotate(270)"/>
                    <line x1="0" y1="-92" x2="0" y2="-89" transform="rotate(285)"/>
                    <line x1="0" y1="-92" x2="0" y2="-88" transform="rotate(300)"/>
                    <line x1="0" y1="-92" x2="0" y2="-89" transform="rotate(315)"/>
                    <line x1="0" y1="-92" x2="0" y2="-89" transform="rotate(330)"/>
                    <line x1="0" y1="-92" x2="0" y2="-89" transform="rotate(345)"/>
                </g>

                <circle class="ring-outer" cx="110" cy="110" r="96" />
                <circle class="ring-bg" cx="110" cy="110" r="84" />
                <circle class="ring-inner" cx="110" cy="110" r="72" />
                <circle class="ring-progress" cx="110" cy="110" r="84" />
                <circle class="ring-dot" cx="110" cy="26" r="3" />
            </svg>
        </div>

        <h1 class="wordmark">deepquest<span class="dot-io">.io</span></h1>

        <div class="terminal" id="terminal"></div>

        <p class="tagline" id="tagline">We're building something. Stay curious.</p>
    </div>

    <script>
        // ===== 1. PARTICLE NETWORK =====
        const canvas = document.getElementById('network-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const CONNECTION_DIST = 120;
        const PARTICLE_COUNT = window.innerWidth < 640 ? 30 : 60;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.r = Math.random() * 1.5 + 0.5;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
        }

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push(new Particle());
        }

        function drawNetwork() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw connections
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < CONNECTION_DIST) {
                        const alpha = (1 - dist / CONNECTION_DIST) * 0.08;
                        ctx.strokeStyle = `rgba(148, 163, 184, ${alpha})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }

            // Draw particles
            for (const p of particles) {
                p.update();
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(148, 163, 184, 0.15)';
                ctx.fill();
            }

            requestAnimationFrame(drawNetwork);
        }

        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            drawNetwork();
        }

        // ===== 2. RESEARCH COUNTERS =====
        // Count up to baseline, then fluctuate around it
        const targets = { sources: 12847, models: 7, nodes: 2418 };
        const current = { sources: 0, models: 0, nodes: 0 };
        let settled = false;

        // Fast count-up phase (dashboard loading)
        function countUp() {
            let done = true;
            for (const key of ['sources', 'models', 'nodes']) {
                if (current[key] < targets[key]) {
                    const remaining = targets[key] - current[key];
                    current[key] += Math.max(1, Math.ceil(remaining * 0.08));
                    if (current[key] > targets[key]) current[key] = targets[key];
                    done = false;
                }
            }
            updateHud();
            if (!done) {
                setTimeout(countUp, 40);
            } else {
                settled = true;
                fluctuate();
            }
        }

        // Gentle fluctuation phase (live system feel)
        function fluctuate() {
            current.sources += Math.floor(Math.random() * 11) - 5; // ±5
            current.nodes += Math.floor(Math.random() * 7) - 3;    // ±3
            current.models += Math.random() < 0.05 ? (Math.random() < 0.5 ? 1 : -1) : 0;
            // Keep within reasonable range
            current.sources = Math.max(targets.sources - 30, Math.min(targets.sources + 30, current.sources));
            current.nodes = Math.max(targets.nodes - 20, Math.min(targets.nodes + 20, current.nodes));
            current.models = Math.max(5, Math.min(9, current.models));
            updateHud();
            setTimeout(fluctuate, 2000 + Math.random() * 1500);
        }

        function updateHud() {
            document.getElementById('indexed').textContent =
                'INDEXED ' + current.sources.toLocaleString() + ' sources';
            document.getElementById('hud-models').textContent =
                'MODELS ' + current.models + ' | NODES ' + current.nodes.toLocaleString();
        }

        // Start count-up after boot sequence begins
        setTimeout(countUp, 2000);

        // ===== 3. TERMINAL BOOT SEQUENCE =====
        const terminal = document.getElementById('terminal');
        const tagline = document.getElementById('tagline');

        const bootLines = [
            { text: '> initializing deepquest.io...', delay: 45, pause: 350 },
            { text: '> scanning knowledge base.... ', delay: 38, ok: true, pause: 400 },
            { text: '> loading agents............. ', delay: 40, ok: true, pause: 350 },
            { text: '> memory systems online...... ', delay: 36, ok: true, pause: 380 },
            { text: '> deep learning initialized.. ', delay: 42, ok: true, pause: 450 },
            { text: '> STATUS: ', delay: 55, status: 'INITIALIZING', pause: 0 }
        ];

        let lineIdx = 0;

        function typeLine() {
            if (lineIdx >= bootLines.length) {
                setTimeout(() => tagline.classList.add('show'), 400);
                return;
            }

            const cfg = bootLines[lineIdx];
            const el = document.createElement('div');
            el.className = 'terminal-line visible';
            terminal.appendChild(el);

            let i = 0;
            let buf = '';

            function tick() {
                if (i < cfg.text.length) {
                    buf += cfg.text[i];
                    el.innerHTML = buf + '<span class="t-cursor"></span>';
                    i++;
                    setTimeout(tick, cfg.delay + (Math.random() * 16 - 8));
                } else {
                    if (cfg.ok) {
                        el.innerHTML = buf + '<span class="ok-tag">[OK]</span>';
                    } else if (cfg.status) {
                        el.innerHTML = buf + '<span class="status-line">' + cfg.status + '</span>';
                    } else {
                        el.innerHTML = buf;
                    }
                    lineIdx++;
                    setTimeout(typeLine, cfg.pause);
                }
            }
            tick();
        }

        setTimeout(typeLine, 1800);

        // ===== 4. CLOCK =====
        function updateClock() {
            const n = new Date();
            document.getElementById('clock').textContent =
                String(n.getHours()).padStart(2, '0') + ':' +
                String(n.getMinutes()).padStart(2, '0') + ':' +
                String(n.getSeconds()).padStart(2, '0');
        }
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
