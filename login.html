<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — deepquest</title>
  <meta name="description" content="deepquest — agentic medical research. Launching soon." />
  <!-- Coming-soon holding page: keep it out of the index until sign-in opens. -->
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* Every value below is copied verbatim from the app so this page renders
       identically to localhost/login. Tokens mirror the app's globals.css. */
    :root {
      --landing-bg: #0f1114;
      --landing-accent-light: #94a3b8;
      --landing-success: #4a6b5d;
      --landing-text-primary: #d5d8db;
      --landing-text-secondary: #8b9298;
      --landing-text-muted: #636e72;
      --landing-border: rgba(100, 116, 139, 0.15);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-jetbrains: 'JetBrains Mono';
      --font-playfair: 'Playfair Display';
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--landing-bg); color: var(--landing-text-primary); font-family: var(--font-sans); min-height: 100vh; display: flex; overflow: hidden; -webkit-font-smoothing: antialiased; }

    /* Brand chrome (matches (auth)/layout.tsx exactly) */
    .logo { position: fixed; top: 26px; left: 32px; z-index: 30; display: inline-flex; align-items: center; gap: 11px; text-decoration: none; }
    .wordmark { font-family: var(--font-playfair), serif; font-size: 1.125rem; font-weight: 500; letter-spacing: -0.025em; color: var(--landing-text-primary); }
    .io { color: var(--landing-accent-light); }
    .seeker-node { transform-box: view-box; transform-origin: 32px 32px; animation: seeker-orbit 10s linear infinite; }
    @keyframes seeker-orbit { to { transform: rotate(360deg); } }

    /* Left — living atmosphere. Boot log CENTRED in the panel (AuthAtmosphere). */
    .left { position: relative; width: 56%; display: flex; align-items: center; justify-content: center; padding: 4.5rem 2rem; overflow: hidden; isolation: isolate; background: radial-gradient(circle at 32% 22%, rgba(148,163,184,.06), transparent 60%), linear-gradient(160deg, rgba(28,32,38,1) 0%, var(--landing-bg) 100%); }
    .left::before { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(100,116,139,.014) 2px, rgba(100,116,139,.014) 4px); }
    .left::after { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,.5) 100%); }
    .atmos-canvas { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
    .copyr { position: absolute; bottom: 24px; left: 34px; z-index: 4; font-family: var(--font-jetbrains), monospace; font-size: 0.75rem; color: var(--landing-text-muted); }

    .term { position: relative; z-index: 4; font-family: var(--font-jetbrains), monospace; font-size: clamp(.74rem, 1vw, .82rem); font-weight: 300; line-height: 1.9; color: var(--landing-text-muted); text-align: left; width: 23rem; max-width: 100%; opacity: 0; animation: aa-fade .6s ease .5s forwards; }
    .tline { display: flex; align-items: center; min-height: 1.9em; }
    .tc { white-space: pre; }
    .dots { flex: 1; margin: 0 .7em; border-bottom: 1px dotted rgba(100,116,139,.32); transform: translateY(-.28em); }
    .ok { color: var(--landing-success); font-weight: 500; white-space: nowrap; text-shadow: 0 0 8px rgba(74,107,93,.5); }
    .ok.flash { animation: aa-okflash .5s ease-out; }
    .tline.status { margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--landing-border); }
    .sval-line { color: var(--landing-accent-light); font-weight: 500; letter-spacing: .02em; animation: aa-statuspulse 3s ease-in-out infinite; }
    .t-cursor { display: inline-block; width: .5em; height: 1.05em; margin-left: 2px; vertical-align: text-bottom; background: var(--landing-accent-light); animation: aa-blink 1s step-end infinite; }
    @keyframes aa-blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @keyframes aa-okflash { 0% { text-shadow: 0 0 16px rgba(74,107,93,.5); } 100% { text-shadow: 0 0 8px rgba(74,107,93,.5); } }
    @keyframes aa-statuspulse { 0%, 100% { opacity: .7; text-shadow: 0 0 8px rgba(148,163,184,.12); } 50% { opacity: 1; text-shadow: 0 0 16px rgba(148,163,184,.12); } }
    @keyframes aa-fade { to { opacity: 1; } }

    /* Right — sign-in form panel (matches (auth)/layout.tsx) */
    .right { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; border-left: 1px solid var(--landing-border); background: linear-gradient(180deg, rgba(18,20,25,1) 0%, var(--landing-bg) 100%); }
    .rinner { width: 100%; max-width: 360px; position: relative; }
    .mobile-logo { display: none; }

    /* Form — values copied verbatim from (auth)/login/page.tsx */
    .f-head { text-align: center; margin-bottom: 40px; }
    .f-h1 { font-size: 1.5rem; font-weight: 500; letter-spacing: -0.025em; color: var(--landing-text-primary); }
    .f-sub { margin-top: 8px; font-size: 0.875rem; color: var(--landing-text-secondary); }
    .f-oauth { display: flex; gap: 10px; margin-bottom: 20px; }
    .f-obtn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; background: rgba(255,255,255,0.03); border: 1px solid rgba(100,116,139,0.18); border-radius: 8px; color: var(--landing-text-primary); font-family: var(--font-sans); font-size: 13px; font-weight: 500; }
    .f-divider { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .f-divider .rule { flex: 1; height: 1px; background: rgba(100,116,139,0.12); }
    .f-divider .txt { font-family: var(--font-mono); font-size: 10px; color: var(--landing-text-muted); text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
    .f-form { display: flex; flex-direction: column; gap: 16px; }
    .f-label { display: block; font-size: 12px; font-weight: 500; color: var(--landing-text-secondary); margin-bottom: 6px; }
    .f-prow { display: flex; align-items: center; justify-content: space-between; }
    .f-forgot { font-size: 11px; color: var(--landing-accent-light); text-decoration: none; font-weight: 500; margin-bottom: 6px; }
    .f-input { width: 100%; padding: 10px 14px; background: rgba(255,255,255,0.03); border: 1px solid rgba(100,116,139,0.18); border-radius: 8px; font-family: var(--font-sans); font-size: 13px; color: var(--landing-text-primary); outline: none; }
    .f-input::placeholder { color: var(--landing-text-muted); }
    .f-input.pw { padding: 10px 40px 10px 14px; }
    .f-pwrap { position: relative; }
    .f-eye { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; padding: 4px; color: rgba(100,116,139,0.6); display: flex; align-items: center; justify-content: center; }
    .f-signin { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 11px 20px; margin-top: 4px; background: linear-gradient(135deg, rgba(100,116,139,0.9) 0%, rgba(74,85,104,0.9) 100%); border: 1px solid rgba(148,163,184,0.15); border-radius: 8px; color: #fff; font-family: var(--font-sans); font-size: 13px; font-weight: 500; }
    .f-switch { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 24px; font-size: 12px; color: var(--landing-text-muted); }
    .f-switch a { color: var(--landing-accent-light); font-size: 12px; font-weight: 500; text-decoration: none; }
    .f-footer { margin-top: 28px; padding-top: 20px; border-top: 1px solid rgba(100,116,139,0.08); text-align: center; }
    .f-footer span { font-size: 10px; color: rgba(99,110,114,0.5); letter-spacing: 0.02em; }
    .f-footer a { color: inherit; text-decoration: underline; }

    /* Coming-soon gate: dim + blur the form, float a lock pill over it. */
    .f-dim { filter: blur(2px) saturate(0.55); opacity: 0.28; pointer-events: none; user-select: none; }
    .f-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .f-pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 17px; border-radius: 999px; border: 1px solid rgba(148,163,184,0.28); background: rgba(148,163,184,0.09); color: var(--landing-text-primary); font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }

    @media (max-width: 1023px) {
      /* Mobile: hide the atmosphere panel + its fixed logo, show the centered
         wordmark, and give the form room so it never overflows sideways. */
      body { overflow-x: hidden; overflow-y: auto; }
      .left { display: none; }
      .logo { display: none; }
      .right { border-left: none; width: 100%; padding: 2.5rem 1.5rem; }
      .mobile-logo { display: block; text-align: center; margin-bottom: 32px; }
      .mobile-logo a { font-family: var(--font-playfair), serif; font-size: 1.5rem; font-weight: 500; letter-spacing: -0.025em; color: var(--landing-text-primary); text-decoration: none; }
    }
    /* Reduced motion — static "ready" state, no canvas, no cursor, no orbit. */
    @media (prefers-reduced-motion: reduce) {
      .atmos-canvas { display: none; }
      .term { opacity: 1; animation: none; }
      .sval-line, .ok.flash, .seeker-node { animation: none; }
      .t-cursor { display: none; }
    }
  </style>
</head>
<body>
  <a class="logo" href="/">
    <svg width="28" height="28" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <circle cx="32" cy="32" r="23" stroke="var(--landing-accent-light)" stroke-width="2" />
      <g class="seeker-node">
        <circle cx="48.26" cy="15.74" r="6" fill="url(#authSeekerGlow)" />
        <circle cx="48.26" cy="15.74" r="2.7" fill="#f8fafc" />
      </g>
      <defs>
        <radialGradient id="authSeekerGlow" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#e2e8f0" stop-opacity="0.85" />
          <stop offset="1" stop-color="#cbd5e1" stop-opacity="0" />
        </radialGradient>
      </defs>
    </svg>
    <span class="wordmark">deepquest<span class="io">.io</span></span>
  </a>

  <div class="left">
    <canvas class="atmos-canvas" id="atmosCanvas" aria-hidden="true"></canvas>
    <div class="term" id="term" aria-hidden="true"></div>
    <p class="copyr">&copy; 2026 deepquest.io</p>
  </div>

  <div class="right">
    <div class="rinner">
      <div class="mobile-logo"><a href="/">deepquest.io</a></div>

      <div style="position: relative;">
        <div class="f-dim" inert>
          <div class="f-head">
            <h1 class="f-h1">Welcome back</h1>
            <p class="f-sub">Sign in to continue to your research workspace</p>
          </div>

          <div class="f-oauth">
            <button class="f-obtn" type="button" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" /><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" /><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" /><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" /></svg>
              <span>Google</span>
            </button>
            <button class="f-obtn" type="button" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" /></svg>
              <span>GitHub</span>
            </button>
          </div>

          <div class="f-divider">
            <div class="rule"></div>
            <span class="txt">or continue with email</span>
            <div class="rule"></div>
          </div>

          <form class="f-form">
            <div>
              <label class="f-label">Email address</label>
              <input class="f-input" type="email" placeholder="you@company.com" disabled />
            </div>

            <div>
              <div class="f-prow">
                <label class="f-label">Password</label>
                <a class="f-forgot" href="/forgot-password">Forgot?</a>
              </div>
              <div class="f-pwrap">
                <input class="f-input pw" type="password" placeholder="Enter your password" disabled />
                <button class="f-eye" type="button" tabindex="-1" aria-label="Show password">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" /></svg>
                </button>
              </div>
            </div>

            <button class="f-signin" type="submit" disabled><span>Sign in</span></button>
          </form>

          <div class="f-switch">
            <span>New to deepquest?</span>
            <a href="/signup">Create an account</a>
          </div>

          <div class="f-footer">
            <span>By continuing, you agree to our <a href="/terms">Terms of Service</a> and <a href="/privacy">Privacy Policy</a></span>
          </div>
        </div>

        <div class="f-overlay">
          <span class="f-pill">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2" /><path d="M8 11V8a4 4 0 0 1 8 0v3" /></svg>
            Coming soon
          </span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Boot log + particle canvas ported 1:1 from the app's AuthAtmosphere so the
    // static /login left panel matches localhost/login (typed, not static).
    (function () {
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      // ---- Typewriter boot log -------------------------------------------------
      var BOOT = [
        { text: "> connected to deepquest.io" },
        { text: "> knowledge base synced", tag: "OK" },
        { text: "> agents online", tag: "OK" },
        { text: "> semantic search & analysis", tag: "OK" },
        { text: "> evidence engine ready", tag: "OK" },
        { text: "> STATUS: ONLINE", status: true }
      ];
      var START_DELAY = 650, TYPE = 26, JITTER = 26, LINE_PAUSE = 380;

      var term = document.getElementById("term");
      var cursor = document.createElement("span");
      cursor.className = "t-cursor";

      var lines = BOOT.map(function (bl) {
        var row = document.createElement("div");
        row.className = "tline" + (bl.status ? " status" : "");
        var tc = document.createElement("span");
        tc.className = bl.status ? "tc sval-line" : "tc";
        row.appendChild(tc);
        var dots = null, ok = null;
        if (bl.tag) {
          dots = document.createElement("span"); dots.className = "dots"; dots.style.visibility = "hidden";
          ok = document.createElement("span"); ok.className = "ok"; ok.textContent = "[" + bl.tag + "]"; ok.style.visibility = "hidden";
          row.appendChild(dots); row.appendChild(ok);
        }
        term.appendChild(row);
        return { bl: bl, row: row, tc: tc, dots: dots, ok: ok };
      });

      function revealTag(l) {
        if (l.dots) l.dots.style.visibility = "visible";
        if (l.ok) { l.ok.style.visibility = "visible"; l.ok.classList.add("flash"); }
      }

      if (reduce) {
        lines.forEach(function (l) { l.tc.textContent = l.bl.text; revealTag(l); });
      } else {
        var li = 0, ci = 0;
        var step = function () {
          var l = lines[li];
          if (!l) return;
          var full = l.bl.text;
          if (ci < full.length) {
            ci += 1;
            l.tc.textContent = full.slice(0, ci);
            l.row.insertBefore(cursor, l.dots || null);
            var justFinished = ci === full.length;
            if (justFinished) {
              if (l.bl.tag) revealTag(l);
              if (!l.bl.status && cursor.parentNode) cursor.parentNode.removeChild(cursor);
            }
            setTimeout(step, justFinished ? LINE_PAUSE : TYPE + Math.random() * JITTER);
          } else {
            li += 1; ci = 0;
            if (li < lines.length) setTimeout(step, 40);
          }
        };
        setTimeout(step, START_DELAY);
      }

      // ---- Particle-network canvas --------------------------------------------
      var canvas = document.getElementById("atmosCanvas");
      var container = canvas && canvas.parentElement;
      if (!canvas || !container || reduce) { if (canvas) canvas.style.display = "none"; return; }
      var ctx = canvas.getContext("2d");
      if (!ctx) return;
      var A = { r: 148, g: 163, b: 184 };
      function rgba(a) { return "rgba(" + A.r + "," + A.g + "," + A.b + "," + a + ")"; }
      var DIST = 120, width = 0, height = 0, frame = 0, particles = [];
      function seed() {
        var count = width < 480 ? 22 : 40;
        particles = [];
        for (var i = 0; i < count; i++) particles.push({
          x: Math.random() * width, y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
          r: Math.random() * 1.5 + 0.5
        });
      }
      function resize() {
        var rect = container.getBoundingClientRect();
        width = Math.max(1, rect.width); height = Math.max(1, rect.height);
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
        canvas.style.width = width + "px"; canvas.style.height = height + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (!particles.length) seed();
      }
      function render() {
        ctx.clearRect(0, 0, width, height);
        for (var i = 0; i < particles.length; i++) {
          var a = particles[i];
          for (var j = i + 1; j < particles.length; j++) {
            var b = particles[j], dx = a.x - b.x, dy = a.y - b.y, d = Math.sqrt(dx * dx + dy * dy);
            if (d < DIST) { ctx.strokeStyle = rgba((1 - d / DIST) * 0.08); ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
          }
        }
        ctx.fillStyle = rgba(0.15);
        for (var k = 0; k < particles.length; k++) {
          var p = particles[k]; p.x += p.vx; p.y += p.vy;
          if (p.x < 0 || p.x > width) p.vx *= -1;
          if (p.y < 0 || p.y > height) p.vy *= -1;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        }
        frame = requestAnimationFrame(render);
      }
      resize();
      window.addEventListener("resize", resize);
      frame = requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
