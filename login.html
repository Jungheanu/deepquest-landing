<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — deepquest</title>
  <meta name="description" content="deepquest — agentic medical research. Launching soon." />
  <!-- Coming-soon holding page: keep it out of the index until sign-in opens. -->
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* Colours mirror the app's --landing-* tokens so this page matches localhost/login exactly. */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f1114; color: #d5d8db; font-family: 'Inter', -apple-system, sans-serif; min-height: 100vh; display: flex; overflow: hidden; }

    .logo { position: fixed; top: 26px; left: 32px; z-index: 30; display: inline-flex; align-items: center; gap: 11px; text-decoration: none; }
    .wordmark { font-family: 'Playfair Display', serif; font-size: 19px; font-weight: 500; color: #d5d8db; }
    .io { color: #94a3b8; }

    /* Left — living atmosphere. Boot log is CENTRED in the panel (like AuthAtmosphere). */
    .left { position: relative; width: 56%; display: flex; align-items: center; justify-content: center; padding: 4.5rem 2rem; overflow: hidden; isolation: isolate; background: radial-gradient(circle at 32% 22%, rgba(148,163,184,.06), transparent 60%), linear-gradient(160deg, rgba(28,32,38,1) 0%, #0f1114 100%); }
    /* faint scanlines + vignette echo the app's atmosphere texture */
    .left::before { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(100,116,139,.014) 2px, rgba(100,116,139,.014) 4px); }
    .left::after { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,.5) 100%); }
    .atmos-canvas { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
    .copyr { position: absolute; bottom: 24px; left: 34px; z-index: 4; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #636e72; }

    .term { position: relative; z-index: 4; font-family: 'JetBrains Mono', monospace; font-size: clamp(.74rem, 1vw, .82rem); font-weight: 300; line-height: 1.9; color: #636e72; text-align: left; width: 23rem; max-width: 100%; opacity: 0; animation: aa-fade .6s ease .5s forwards; }
    .tline { display: flex; align-items: center; min-height: 1.9em; }
    .tc { white-space: pre; }
    .dots { flex: 1; margin: 0 .7em; border-bottom: 1px dotted rgba(100,116,139,.32); transform: translateY(-.28em); }
    .ok { color: #4a6b5d; font-weight: 500; white-space: nowrap; text-shadow: 0 0 8px rgba(74,107,93,.5); }
    .ok.flash { animation: aa-okflash .5s ease-out; }
    .tline.status { margin-top: 6px; padding-top: 8px; border-top: 1px solid rgba(100,116,139,.15); }
    /* whole "> STATUS: ONLINE" line pulses in the accent colour, exactly like the app */
    .sval-line { color: #94a3b8; font-weight: 500; letter-spacing: .02em; animation: aa-statuspulse 3s ease-in-out infinite; }
    .t-cursor { display: inline-block; width: .5em; height: 1.05em; margin-left: 2px; vertical-align: text-bottom; background: #94a3b8; animation: aa-blink 1s step-end infinite; }

    @keyframes aa-blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @keyframes aa-okflash { 0% { text-shadow: 0 0 16px rgba(74,107,93,.5); } 100% { text-shadow: 0 0 8px rgba(74,107,93,.5); } }
    @keyframes aa-statuspulse { 0%, 100% { opacity: .7; text-shadow: 0 0 8px rgba(148,163,184,.12); } 50% { opacity: 1; text-shadow: 0 0 16px rgba(148,163,184,.12); } }
    @keyframes aa-fade { to { opacity: 1; } }

    /* Right — sign-in form panel, matching the app's (auth)/layout gradient + border. */
    .right { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; border-left: 1px solid rgba(100,116,139,.15); background: linear-gradient(180deg, rgba(18,20,25,1) 0%, #0f1114 100%); }
    .rinner { width: 100%; max-width: 360px; position: relative; }
    h1 { font-size: 26px; font-weight: 600; letter-spacing: -.02em; color: #eef1f4; text-align: center; }
    .sub { font-size: 13px; color: #8b9298; text-align: center; margin: 8px 0 40px; }
    .oauth { display: flex; gap: 10px; margin-bottom: 18px; }
    .obtn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; border: 1px solid rgba(100,116,139,.2); border-radius: 9px; background: rgba(255,255,255,.02); color: #d5d8db; font-size: 13px; font-weight: 500; font-family: inherit; }
    .divider { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: .06em; color: #636e72; }
    .divider span { flex: 1; height: 1px; background: rgba(100,116,139,.14); }
    label { display: block; font-size: 12px; font-weight: 500; color: #8b9298; margin-bottom: 7px; }
    .prow { display: flex; justify-content: space-between; align-items: center; }
    .forgot { font-size: 11px; color: #94a3b8; text-decoration: none; font-weight: 500; }
    .inp { position: relative; margin-bottom: 15px; }
    .inp input { width: 100%; padding: 11px 14px; background: rgba(255,255,255,.03); border: 1px solid rgba(100,116,139,.2); border-radius: 9px; color: #d5d8db; font-family: inherit; font-size: 13px; outline: none; }
    .inp input::placeholder { color: #636e72; }
    .eye { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); opacity: .4; font-size: 13px; }
    .signin { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid rgba(148,163,184,.15); border-radius: 9px; background: linear-gradient(135deg, rgba(100,116,139,.9), rgba(74,85,104,.9)); color: #fff; font-size: 13px; font-weight: 600; font-family: inherit; }
    .switch { margin-top: 20px; font-size: 12.5px; color: #636e72; text-align: center; }
    .switch a { color: #94a3b8; text-decoration: none; font-weight: 500; }

    /* Coming-soon gate: dim + blur the form, float a lock pill over it. */
    .pilllock { display: inline-flex; align-items: center; gap: 8px; padding: 8px 17px; border-radius: 999px; border: 1px solid rgba(148,163,184,.28); background: rgba(148,163,184,.09); color: #eef1f4; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
    .pilllock svg { width: 13px; height: 13px; color: #94a3b8; }
    .vf .fw { filter: blur(1.5px) saturate(.55); opacity: .26; pointer-events: none; }
    .vf .ov { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }

    @media (max-width: 860px) {
      body { overflow: auto; }
      .left { display: none; }
      .right { border-left: none; width: 100%; }
    }
    /* Reduced motion — static "ready" state, no canvas, no cursor. */
    @media (prefers-reduced-motion: reduce) {
      .atmos-canvas { display: none; }
      .term { opacity: 1; animation: none; }
      .sval-line, .ok.flash { animation: none; }
      .t-cursor { display: none; }
    }
  </style>
</head>
<body>
  <a class="logo" href="/">
    <svg width="28" height="28" viewBox="0 0 64 64" fill="none">
      <circle cx="32" cy="32" r="23" stroke="#94a3b8" stroke-width="2" />
      <circle cx="48.26" cy="15.74" r="6" fill="#cbd5e1" opacity=".5" />
      <circle cx="48.26" cy="15.74" r="2.7" fill="#f8fafc" />
    </svg>
    <span class="wordmark">deepquest<span class="io">.io</span></span>
  </a>

  <div class="left">
    <canvas class="atmos-canvas" id="atmosCanvas" aria-hidden="true"></canvas>
    <div class="term" id="term" aria-hidden="true"></div>
    <p class="copyr">&copy; 2026 deepquest.io</p>
  </div>

  <div class="right">
    <div class="rinner vf">
      <div class="fw">
        <h1>Welcome back</h1>
        <p class="sub">Sign in to continue to your research workspace</p>
        <div class="oauth">
          <button class="obtn" disabled>
            <svg width="17" height="17" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" /><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" /><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93z" /><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" /></svg> Google
          </button>
          <button class="obtn" disabled>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="#d5d8db"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.23c-3.34.73-4.04-1.42-4.04-1.42-.55-1.39-1.33-1.76-1.33-1.76-1.09-.74.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.49 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.14-.3-.54-1.52.1-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 016.01 0c2.29-1.55 3.3-1.23 3.3-1.23.64 1.66.24 2.88.12 3.18.77.84 1.23 1.91 1.23 3.22 0 4.61-2.8 5.63-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.82.58C20.56 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z" /></svg> GitHub
          </button>
        </div>
        <div class="divider"><span></span>OR CONTINUE WITH EMAIL<span></span></div>
        <label>Email address</label>
        <div class="inp"><input placeholder="you@company.com" disabled /></div>
        <div class="prow"><label>Password</label><a class="forgot">Forgot?</a></div>
        <div class="inp"><input type="password" placeholder="Enter your password" disabled /><span class="eye">&#128065;</span></div>
        <button class="signin" disabled>Sign in</button>
        <p class="switch">New to deepquest? <a>Create an account</a></p>
      </div>
      <div class="ov">
        <span class="pilllock">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2" /><path d="M8 11V8a4 4 0 0 1 8 0v3" /></svg>
          Coming soon
        </span>
      </div>
    </div>
  </div>

  <script>
    // Boot log + particle canvas ported 1:1 from the app's AuthAtmosphere so the
    // static /login left panel matches localhost/login (typed, not static).
    (function () {
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      // ---- Typewriter boot log -------------------------------------------------
      var BOOT = [
        { text: "> connected to deepquest.io" },
        { text: "> knowledge base synced", tag: "OK" },
        { text: "> agents online", tag: "OK" },
        { text: "> semantic search & analysis", tag: "OK" },
        { text: "> evidence engine ready", tag: "OK" },
        { text: "> STATUS: ONLINE", status: true }
      ];
      var START_DELAY = 650, TYPE = 26, JITTER = 26, LINE_PAUSE = 380;

      var term = document.getElementById("term");
      var cursor = document.createElement("span");
      cursor.className = "t-cursor";

      var lines = BOOT.map(function (bl) {
        var row = document.createElement("div");
        row.className = "tline" + (bl.status ? " status" : "");
        var tc = document.createElement("span");
        tc.className = bl.status ? "tc sval-line" : "tc";
        row.appendChild(tc);
        var dots = null, ok = null;
        if (bl.tag) {
          dots = document.createElement("span"); dots.className = "dots"; dots.style.visibility = "hidden";
          ok = document.createElement("span"); ok.className = "ok"; ok.textContent = "[" + bl.tag + "]"; ok.style.visibility = "hidden";
          row.appendChild(dots); row.appendChild(ok);
        }
        term.appendChild(row);
        return { bl: bl, row: row, tc: tc, dots: dots, ok: ok };
      });

      function revealTag(l) {
        if (l.dots) l.dots.style.visibility = "visible";
        if (l.ok) { l.ok.style.visibility = "visible"; l.ok.classList.add("flash"); }
      }

      if (reduce) {
        // static, fully-typed "ready" state
        lines.forEach(function (l) { l.tc.textContent = l.bl.text; revealTag(l); });
      } else {
        var li = 0, ci = 0;
        var step = function () {
          var l = lines[li];
          if (!l) return; // sequence complete — cursor stays on the status line
          var full = l.bl.text;
          if (ci < full.length) {
            ci += 1;
            l.tc.textContent = full.slice(0, ci);
            l.row.insertBefore(cursor, l.dots || null); // cursor rides the active line
            var justFinished = ci === full.length;
            if (justFinished) {
              if (l.bl.tag) revealTag(l);
              // drop the cursor during the pause, except on the persistent status line
              if (!l.bl.status && cursor.parentNode) cursor.parentNode.removeChild(cursor);
            }
            setTimeout(step, justFinished ? LINE_PAUSE : TYPE + Math.random() * JITTER);
          } else {
            li += 1; ci = 0;
            if (li < lines.length) setTimeout(step, 40);
          }
        };
        setTimeout(step, START_DELAY);
      }

      // ---- Particle-network canvas --------------------------------------------
      var canvas = document.getElementById("atmosCanvas");
      var container = canvas && canvas.parentElement;
      if (!canvas || !container || reduce) { if (canvas) canvas.style.display = "none"; return; }
      var ctx = canvas.getContext("2d");
      if (!ctx) return;
      var A = { r: 148, g: 163, b: 184 };
      function rgba(a) { return "rgba(" + A.r + "," + A.g + "," + A.b + "," + a + ")"; }
      var DIST = 120, width = 0, height = 0, frame = 0, particles = [];
      function seed() {
        var count = width < 480 ? 22 : 40;
        particles = [];
        for (var i = 0; i < count; i++) particles.push({
          x: Math.random() * width, y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
          r: Math.random() * 1.5 + 0.5
        });
      }
      function resize() {
        var rect = container.getBoundingClientRect();
        width = Math.max(1, rect.width); height = Math.max(1, rect.height);
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
        canvas.style.width = width + "px"; canvas.style.height = height + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (!particles.length) seed();
      }
      function render() {
        ctx.clearRect(0, 0, width, height);
        for (var i = 0; i < particles.length; i++) {
          var a = particles[i];
          for (var j = i + 1; j < particles.length; j++) {
            var b = particles[j], dx = a.x - b.x, dy = a.y - b.y, d = Math.sqrt(dx * dx + dy * dy);
            if (d < DIST) { ctx.strokeStyle = rgba((1 - d / DIST) * 0.08); ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
          }
        }
        ctx.fillStyle = rgba(0.15);
        for (var k = 0; k < particles.length; k++) {
          var p = particles[k]; p.x += p.vx; p.y += p.vy;
          if (p.x < 0 || p.x > width) p.vx *= -1;
          if (p.y < 0 || p.y > height) p.vy *= -1;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        }
        frame = requestAnimationFrame(render);
      }
      resize();
      window.addEventListener("resize", resize);
      frame = requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
