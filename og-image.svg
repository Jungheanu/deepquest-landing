<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f1114"/>

  <!-- Subtle grid dots -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="0.5" fill="rgba(148,163,184,0.1)"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Vignette -->
  <radialGradient id="vig" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#0f1114" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#vig)"/>

  <!-- Ring -->
  <circle cx="600" cy="240" r="70" fill="none" stroke="rgba(148,163,184,0.15)" stroke-width="1"/>
  <circle cx="600" cy="240" r="70" fill="none" stroke="url(#ringG)" stroke-width="2" stroke-dasharray="352 88" stroke-linecap="round"/>
  <circle cx="600" cy="240" r="80" fill="none" stroke="rgba(148,163,184,0.08)" stroke-width="0.5" stroke-dasharray="6 12"/>
  <circle cx="600" cy="240" r="58" fill="none" stroke="rgba(148,163,184,0.05)" stroke-width="0.5"/>

  <!-- Ring gradient -->
  <linearGradient id="ringG" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#94a3b8"/>
    <stop offset="100%" stop-color="#64748b" stop-opacity="0.2"/>
  </linearGradient>

  <!-- Leading dot -->
  <circle cx="600" cy="170" r="4" fill="#94a3b8"/>

  <!-- Orbit dots -->
  <circle cx="510" cy="210" r="2.5" fill="#94a3b8" opacity="0.5"/>
  <circle cx="680" cy="280" r="2" fill="#94a3b8" opacity="0.35"/>

  <!-- Wordmark -->
  <text x="600" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="64" font-weight="500" fill="#d5d8db" letter-spacing="-1">deepquest<tspan fill="#94a3b8">.io</tspan></text>

  <!-- Tagline -->
  <text x="600" y="450" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="300" fill="#8b9298">We're building something. Stay curious.</text>

  <!-- Status dot + text -->
  <circle cx="530" cy="500" r="3" fill="#4a6b5d"/>
  <text x="542" y="504" font-family="monospace" font-size="12" font-weight="300" fill="#636e72">SYS://deepquest.io</text>
</svg>
